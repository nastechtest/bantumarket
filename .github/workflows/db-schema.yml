name: Schema — migrations on real PostgreSQL

# The DDL is where the money invariants are enforced (one ledger row per capture, one capture per
# order, balances that cannot go negative). Until this job existed they were only asserted in PHP
# unit tests; here they are applied to an actual PostgreSQL 16 and the constraints are real.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-schema-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    name: Apply 001..013
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nastech
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: nastech
    steps:
      - uses: actions/checkout@v4

      - name: Install the psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Apply every migration in filename order
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          for file in $(ls db/migrations/*.sql | sort); do
            echo "::group::applying $file"
            psql -v ON_ERROR_STOP=1 -q -f "$file"
            echo "::endgroup::"
          done

      - name: Show what was created
        run: psql -c '\dt' -c "select conname from pg_constraint where contype = 'c' order by 1;" | head -60
